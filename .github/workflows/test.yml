name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mysql:
    name: MySQL 9.7.1 (Python 3.14)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.7.1@sha256:ad88e1c86cbf12ef52d0a0360cd4b774d22956c5ee9c565645fb019d7aacb6c3
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      PAPERQUERY_TEST_MYSQL_ADMIN_URL: mysql+pymysql://root:test@127.0.0.1:3306/?charset=utf8mb4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r requirements.lock
      - name: Run the full unittest suite in isolation
        run: >-
          python3 tools/run_isolated_tests.py discover -s tests -p "test_*.py" -v
