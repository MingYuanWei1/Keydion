services:
  web:
    build: .
    container_name: keydion-web-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      GUNICORN_BIND: "unix:/var/run/keydion/keydion.sock"
    command: ["gunicorn", "-c", "gunicorn.conf.py", "wsgi:app"]
    volumes:
      - keydion-socket:/var/run/keydion
      - ./papers:/app/papers
      - ./data:/app/data
      - ./static/uploads:/app/static/uploads
    expose:
      - "8000"

  publishing-worker:
    build: .
    container_name: keydion-publishing-worker-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["python", "-m", "tools.publishing_worker"]
    stop_grace_period: 1900s
    volumes:
      - ./papers:/app/papers
      - ./data:/app/data

  attachment-worker:
    build: .
    container_name: keydion-attachment-worker-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["python", "-m", "tools.attachment_worker"]
    stop_grace_period: 90s
    volumes:
      - ./data:/app/data

  # Approximates deploy/keydion-paper-integrity.timer (daily scan) as a loop;
  # Compose has no native scheduler.
  integrity:
    build: .
    container_name: keydion-paper-integrity-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    command: ["sh", "-c", "while true; do python -m tools.verify_paper_integrity; sleep 86400; done"]
    volumes:
      - ./papers:/app/papers
      - ./data:/app/data

  nginx:
    image: nginx:1.27-alpine
    container_name: keydion-nginx-prod
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - keydion-socket:/var/run/keydion
      - ./static:/app/static:ro

volumes:
  keydion-socket:
