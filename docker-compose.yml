services:
  web:
    build: .
    container_name: keydion-web
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      # Override the DB URL to point to the host's local MySQL service
      PAPERQUERY_DATABASE_URL: "mysql+pymysql://keydion:keydion_local@host.docker.internal:3306/Keydion_db?charset=utf8mb4"
      HOST: "0.0.0.0"
      PORT: "4000"
    command: ["python", "-m", "flask", "--app", "app", "run", "--debug", "--host", "0.0.0.0", "--port", "4000"]
    volumes:
      - ./papers:/app/papers
      - ./data:/app/data
      - ./static:/app/static
      - ./templates:/app/templates
      - ./app.py:/app/app.py
