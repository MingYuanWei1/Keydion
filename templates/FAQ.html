<!doctype html>
<html lang="{{ current_locale or 'zh-CN' }}">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='K.png') }}">
  <title>FAQs · Keydion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #faf8f5;
      --white: #ffffff;
      --ink: #1a1a1a;
      --ink-soft: #3d3d3d;
      --muted: #6b6b6b;
      --border: #e0dbd0;
      --accent: #8b1a1a;
      --accent-hover: #6b1212;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      background: rgba(250, 248, 245, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.3px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .lang-btn {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      padding: 5px 12px;
      border: 1px solid var(--border);
      transition: all 0.15s;
    }
    .lang-btn:hover { color: var(--ink); border-color: var(--ink); }

    /* ── Main ── */
    .faq-container {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 28px 64px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 40px;
      font-weight: 600;
      color: var(--ink);
      text-align: center;
      margin-bottom: 48px;
      letter-spacing: -0.5px;
    }

    .faq-item {
      margin-bottom: 28px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }
    .faq-item:last-of-type {
      border-bottom: none !important;
      margin-bottom: 0 !important;
      padding-bottom: 0 !important;
    }

    .faq-q {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }
    .faq-q-mark {
      width: 24px; height: 24px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
    }
    .faq-q-text {
      font-size: 15.5px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--ink);
    }
    .faq-a {
      font-size: 14.5px;
      color: var(--ink-soft);
      line-height: 1.75;
      padding-left: 36px;
    }

    /* ── Footer ── */
    .faq-footer {
      text-align: center;
      margin-top: 36px;
    }
    .faq-footer a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 10px 24px;
      transition: all 0.15s;
    }
    .faq-footer a:hover { color: var(--accent-hover); border-color: var(--accent); }

    @media (max-width: 640px) {
      h1 { font-size: 30px; }
      .faq-container { padding: 32px 20px 48px; }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-inner">
      <a href="{{ url_for('index') }}" class="logo">Keydion</a>
      <div class="header-right">
        <a class="lang-btn" href="{{ url_for('set_language', locale_code='en' if current_locale == 'zh' else 'zh', next=request.full_path) }}">
          {{ 'EN' if current_locale == 'zh' else '中文' }}
        </a>
      </div>
    </div>
  </header>

  <div class="faq-container">
    <h1>FAQs</h1>

    <div class="faq-item">
      <div class="faq-q">
        <span class="faq-q-mark">Q</span>
        <span class="faq-q-text">{{ _('faq_q1') }}</span>
      </div>
      <p class="faq-a">{{ _('faq_a1') }}</p>
    </div>

    <div class="faq-item">
      <div class="faq-q">
        <span class="faq-q-mark">Q</span>
        <span class="faq-q-text">{{ _('faq_q2') }}</span>
      </div>
      <p class="faq-a">{{ _('faq_a2') }}</p>
    </div>

    <div class="faq-item">
      <div class="faq-q">
        <span class="faq-q-mark">Q</span>
        <span class="faq-q-text">{{ _('faq_q3') }}</span>
      </div>
      <p class="faq-a">{{ _('faq_a3') }}</p>
    </div>

    <div class="faq-item">
      <div class="faq-q">
        <span class="faq-q-mark">Q</span>
        <span class="faq-q-text">{{ _('faq_q4') }}</span>
      </div>
      <p class="faq-a">{{ _('faq_a4') }}</p>
    </div>

    <div class="faq-item">
      <div class="faq-q">
        <span class="faq-q-mark">Q</span>
        <span class="faq-q-text">{{ _('faq_q5') }}</span>
      </div>
      <p class="faq-a">{{ _('faq_a5') }}</p>
    </div>

    <div class="faq-footer">
      <a href="{{ url_for('index') }}">← {{ _('Back to Home') }}</a>
    </div>
  </div>

</body>
</html>
