upstream keydion_app {
    server unix:/var/run/keydion/keydion.sock;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;
    client_body_timeout 60s;
    send_timeout 60s;

    # Hide nginx version
    server_tokens off;

    # Static assets and user-uploaded images: served directly from disk.
    # Covers /static/css, /static/js, /static/vendor, /static/uploads/news,
    # /static/uploads/journal_covers, /static/uploads/guides, etc.
    location /static/ {
        alias /app/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Application: PDF download/preview routes (/papers/raw, /papers/preview,
    # /papers/<filename>), submission file routes, and everything else go
    # through gunicorn so app.py can enforce auth and download counters.
    location / {
        proxy_pass http://keydion_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
