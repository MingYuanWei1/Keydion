# =============================================================================
# Keydion — nginx site config for a host-managed nginx (NOT the bundled
# docker-compose.prod.yml setup). Pair this with `run_prod.sh` + the systemd
# unit running gunicorn on 127.0.0.1:5000.
#
# Install:
#   sudo cp deploy/keydion.nginx.conf /etc/nginx/conf.d/keydion.conf
#   # …then edit server_name, ssl_certificate, ssl_certificate_key…
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or, if you already have a server block for this domain, copy just the three
# blocks marked `# --- copy me ---` into it.
# =============================================================================

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.example.com;

    # --- TLS — replace with real cert paths (certbot, your CA, etc.) -----------
    ssl_certificate     /etc/letsencrypt/live/yourdomain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Hide nginx version in headers / error pages.
    server_tokens off;

    # Logs (optional — adjust to your existing logging convention).
    access_log /var/log/nginx/keydion.access.log;
    error_log  /var/log/nginx/keydion.error.log warn;

    # --- copy me (1/3): uploads -----------------------------------------------
    # Must match PAPERQUERY_MAX_UPLOAD_MB in /Keydion/.env.prod (default 50).
    client_max_body_size 50M;
    client_body_timeout  60s;
    send_timeout         60s;

    # --- copy me (2/3): static assets served directly from disk ---------------
    # Bypasses gunicorn entirely. Covers /static/css, /static/js, /static/vendor,
    # /static/uploads/news, /static/uploads/journal_covers, /static/uploads/guides.
    location /static/ {
        alias /Keydion/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # --- copy me (3/3): everything else proxied to gunicorn -------------------
    # The X-Forwarded-* headers are non-negotiable: app.py wraps wsgi_app in
    # ProxyFix, which needs X-Forwarded-Proto to generate correct https:// URLs
    # for OAuth callbacks and url_for(..., _external=True).
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
